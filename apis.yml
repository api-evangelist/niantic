apis:
- name: Niantic Spatial Development Kit (NSDK)
  description: >-
    NSDK 4.x is Niantic Spatial's unified, SDK-first developer platform for Unity,
    Swift, Android, and ROS 2, exposing VPS 2.0 visual positioning (centimeter-level
    6DoF localization), semantic understanding, meshing/depth, and the VPS Coverage
    API. Formerly the Lightship Augmented Reality Developer Kit (ARDK). Access is
    authenticated with a Niantic Spatial token (NSDK 4.0+; legacy Lightship API key
    for ARDK 3.x).
