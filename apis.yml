name: Niantic
description: >-
  Niantic Spatial, Inc. (spun out of Niantic, Inc. in 2025 after the sale of its
  games division to Scopely) builds real-world foundation models for physical AI.
  Its Large Geospatial Model (LGM), trained on 30+ billion posed real-world images,
  powers a three-part geospatial platform — Reconstruct (3D models via Gaussian
  splats and meshes), Localize (VPS, centimeter-level 6DoF visual positioning that
  works indoors, outdoors, and in GPS-denied environments), and Understand (semantic
  querying of 3D maps). Developers build on the Niantic Spatial Development Kit
  (NSDK 4.x, formerly the Lightship ARDK) across Unity, Swift, Android, and ROS 2,
  connecting to Scaniverse and VPS 2.0. Enterprise focus areas include robotics,
  defense and intelligence, and oil and gas.
